<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Archive / 01 admin shell PoC."
  />
  <title>Admin / Archive / 01</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --page: #f4f4f1;
      --sidebar: #ffffff;
      --sidebar-hover: #f6f6f3;
      --sidebar-active: #181818;

      --surface: #ffffff;
      --content: #ffffff;

      --text: #171717;
      --muted: #85857f;
      --line: #e5e5df;

      --accent: #d9ff4f;

      --danger: #c93227;
      --danger-dark: #a8241b;
      --danger-soft: #fff0ed;

      --white: #ffffff;

      --sidebar-width: 248px;
      --transition-fast: 160ms ease;
      --transition-normal: 220ms ease;
      --transition-drawer: 300ms cubic-bezier(0.22, 1, 0.36, 1);

      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 18px;
      --radius-pill: 999px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page);
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;

      background: var(--page);
      color: var(--text);

      font-family:
        "DM Sans",
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    svg {
      display: block;
    }

    /* =========================================================
       DESKTOP SHELL
    ========================================================= */

    .admin-shell {
      min-height: 100vh;

      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);

      background: var(--page);
    }

    /* =========================================================
       SIDEBAR
    ========================================================= */

    .sidebar {
      position: sticky;
      top: 0;

      height: 100vh;
      padding: 18px;

      display: flex;
      flex-direction: column;

      border-right: 1px solid var(--line);

      background: var(--sidebar);
    }

    .sidebar__brand {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 38px;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      flex: 0 0 auto;

      display: grid;
      place-items: center;

      border-radius: 9px;

      background: var(--accent);
      color: var(--text);

      font-size: 9px;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .sidebar__brand-copy {
      min-width: 0;
    }

    .sidebar__brand-name {
      margin: 0;

      font-size: 11px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .sidebar__brand-meta {
      margin-top: 4px;

      color: var(--muted);

      font-size: 9px;
      line-height: 1;
      font-weight: 600;
    }

    .sidebar__section-label {
      margin: 0 0 9px;
      padding-left: 4px;

      color: var(--muted);

      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .sidebar__nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sidebar__nav-link {
      min-height: 42px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 11px;

      border-radius: 8px;

      background: transparent;
      color: #65655f;

      font-size: 12px;
      font-weight: 600;

      transition:
        background var(--transition-fast),
        color var(--transition-fast);
    }

    .sidebar__nav-link:hover {
      background: var(--sidebar-hover);
      color: var(--text);
    }

    .sidebar__nav-link.active {
      background: var(--sidebar-active);
      color: var(--white);
    }

    .sidebar__nav-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .sidebar__footer {
      margin-top: auto;

      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sidebar__footer-link {
      min-height: 40px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 11px;

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: #65655f;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;

      transition:
        background var(--transition-fast),
        color var(--transition-fast);
    }

    .sidebar__footer-link:hover {
      background: var(--sidebar-hover);
      color: var(--text);
    }

    .sidebar__footer-link--danger:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* =========================================================
       EMPTY CONTENT SHELL
    ========================================================= */

    .content-shell {
      min-width: 0;
      min-height: 100vh;

      background: var(--content);
    }

    /* =========================================================
       MOBILE HEADER
    ========================================================= */

    .mobile-header {
      position: fixed;
      z-index: 80;

      top: 0;
      left: 0;
      right: 0;

      width: 100%;
      height: 56px;
      padding: 0 14px;

      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      border: 0;
      border-radius: 0;

      background: rgba(255, 255, 255, 0.98);

      box-shadow: none;

      transition:
        transform var(--transition-normal),
        opacity var(--transition-normal);
    }

    .mobile-header.hidden {
      transform: translateY(-64px);
      opacity: 0;
      pointer-events: none;
    }

    .mobile-header__brand {
      min-width: 0;

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .mobile-header__square {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;

      background: var(--accent);
      border: 1px solid var(--text);
    }

    .mobile-header__title {
      overflow: hidden;

      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .mobile-header__menu {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 50%;

      background: var(--text);
      color: var(--white);

      cursor: pointer;
    }

    .mobile-header__menu svg {
      width: 17px;
      height: 17px;
    }

    /* =========================================================
       MOBILE DRAWER
    ========================================================= */

    .mobile-overlay {
      position: fixed;
      z-index: 90;
      inset: 0;

      background: rgb(23 23 23 / 0.24);

      opacity: 0;
      pointer-events: none;

      transition: opacity var(--transition-normal);
    }

    .mobile-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .mobile-drawer {
      position: fixed;
      z-index: 100;

      top: 0;
      left: 0;
      bottom: 0;

      width: min(82vw, 310px);
      padding: 18px;

      display: flex;
      flex-direction: column;

      background: var(--sidebar);
      border-right: 1px solid var(--line);

      transform: translateX(-102%);

      transition: transform var(--transition-drawer);

      overflow-y: auto;
    }

    .mobile-drawer.open {
      transform: translateX(0);
    }

    .mobile-drawer__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;

      margin-bottom: 38px;
    }

    .mobile-drawer__brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .mobile-drawer__close {
      width: 34px;
      height: 34px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--line);
      border-radius: 50%;

      background: var(--white);
      color: var(--text);

      cursor: pointer;
    }

    .mobile-drawer__section-label {
      margin: 0 0 9px;
      padding-left: 4px;

      color: var(--muted);

      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mobile-drawer__nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mobile-drawer__link {
      min-height: 44px;
      padding: 0 12px;

      display: flex;
      align-items: center;
      gap: 11px;

      border: 0;
      border-radius: 8px;

      background: transparent;
      color: #65655f;

      font-size: 12px;
      font-weight: 600;

      cursor: pointer;
    }

    .mobile-drawer__link:hover {
      background: var(--sidebar-hover);
      color: var(--text);
    }

    .mobile-drawer__link.active {
      background: var(--sidebar-active);
      color: var(--white);
    }

    .mobile-drawer__bottom {
      margin-top: auto;
      padding-top: 32px;

      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mobile-drawer__bottom .signout:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    /* =========================================================
       SIGN OUT DIALOG
    ========================================================= */

    .signout-dialog {
      width: min(92vw, 420px);
      padding: 0;

      border: 1px solid var(--line);
      border-radius: 14px;

      background: var(--white);
      color: var(--text);

      box-shadow:
        0 18px 44px rgb(23 23 23 / 0.12),
        0 3px 10px rgb(23 23 23 / 0.06);
    }

    .signout-dialog::backdrop {
      background: rgb(23 23 23 / 0.28);
    }

    .signout-dialog__content {
      padding: 24px;
    }

    .signout-dialog__eyebrow {
      margin-bottom: 8px;

      color: var(--muted);

      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .signout-dialog__title {
      margin: 0 0 9px;

      font-size: 19px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .signout-dialog__copy {
      margin: 0;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.6;
    }

    .signout-dialog__actions {
      padding: 14px 24px 18px;

      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;

      border-top: 1px solid var(--line);
    }

    .dialog-button {
      min-height: 36px;
      padding: 0 13px;

      border-radius: 7px;

      font-size: 10px;
      font-weight: 700;

      cursor: pointer;
    }

    .dialog-button--cancel {
      background: #f5f5f2;
      color: #5d5d58;
    }

    .dialog-button--confirm {
      background: var(--danger);
      color: var(--white);
    }

    .dialog-button--confirm:hover {
      background: var(--danger-dark);
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 820px) {
      .admin-shell {
        display: block;
        min-height: 100vh;
      }

      .sidebar {
        display: none;
      }

      .mobile-header {
        display: flex;
      }

      .content-shell {
        min-height: 100vh;
        background: var(--content);
      }
    }

    @media (max-width: 520px) {
      .mobile-header {
        height: 54px;
        padding: 0 12px;
      }
    }

    @media (max-width: 400px) {
      .mobile-header {
        height: 52px;
        padding: 0 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>

<body>
  <!-- =========================================================
       MOBILE HEADER
  ========================================================== -->

    <button

      <svg

  </aside>

  <!-- =========================================================
       SIGN OUT DIALOG
  ========================================================== -->

  <dialog
    class="signout-dialog"
    data-signout-dialog
  >
    <div class="signout-dialog__content">
      <div class="signout-dialog__eyebrow">
        Account
      </div>

      <h2 class="signout-dialog__title">
        Sign out of the admin workspace?
      </h2>

      <p class="signout-dialog__copy">
        You will be returned to the admin login page.
      </p>
    </div>

    <div class="signout-dialog__actions">
      <button
        class="dialog-button dialog-button--cancel"
        type="button"
        data-signout-cancel
      >
        Cancel
      </button>

      <button
        class="dialog-button dialog-button--confirm"
        type="button"
        data-signout-confirm
      >
        Sign out
      </button>
    </div>
  </dialog>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      /* =======================================================
         MOBILE DRAWER
      ======================================================== */

      const drawer = document.querySelector(
        "[data-mobile-drawer]"
      );

      const overlay = document.querySelector(
        "[data-drawer-overlay]"
      );

      const openButton = document.querySelector(
        "[data-menu-open]"
      );

      const closeButton = document.querySelector(
        "[data-menu-close]"
      );

      function openDrawer() {
        if (!drawer || !overlay) {
          return;
        }

        drawer.classList.add("open");
        overlay.classList.add("open");

        drawer.setAttribute(
          "aria-hidden",
          "false"
        );

        openButton?.setAttribute(
          "aria-expanded",
          "true"
        );

        document.body.style.overflow = "hidden";
      }

      function closeDrawer() {
        if (!drawer || !overlay) {
          return;
        }

        drawer.classList.remove("open");
        overlay.classList.remove("open");

        drawer.setAttribute(
          "aria-hidden",
          "true"
        );

        openButton?.setAttribute(
          "aria-expanded",
          "false"
        );

        document.body.style.overflow = "";
      }

      openButton?.addEventListener(
        "click",
        openDrawer
      );

      closeButton?.addEventListener(
        "click",
        closeDrawer
      );

      overlay?.addEventListener(
        "click",
        closeDrawer
      );

      drawer?.querySelectorAll("a").forEach(
        (link) => {
          link.addEventListener(
            "click",
            closeDrawer
          );
        }
      );

      window.addEventListener(
        "resize",
        () => {
          if (window.innerWidth > 820) {
            closeDrawer();
          }
        }
      );

      /* =======================================================
         MOBILE HEADER SCROLL BEHAVIOR
      ======================================================== */

      const mobileHeader =
        document.querySelector(
          "[data-mobile-header]"
        );

      let lastScrollY =
        window.scrollY;

      window.addEventListener(
        "scroll",
        () => {
          if (
            !mobileHeader ||
            window.innerWidth > 820
          ) {
            return;
          }

          const currentScrollY =
            window.scrollY;

          if (currentScrollY <= 4) {
            mobileHeader.classList.remove(
              "hidden"
            );
          } else if (
            currentScrollY >
            lastScrollY + 4
          ) {
            mobileHeader.classList.add(
              "hidden"
            );
          } else if (
            currentScrollY <
            lastScrollY - 4
          ) {
            mobileHeader.classList.remove(
              "hidden"
            );
          }

          lastScrollY = currentScrollY;
        },
        { passive: true }
      );

      /* =======================================================
         SIGN OUT
      ======================================================== */

      const signoutDialog =
        document.querySelector(
          "[data-signout-dialog]"
        );

      const signoutOpenButtons =
        document.querySelectorAll(
          "[data-signout-open]"
        );

      const signoutCancel =
        document.querySelector(
          "[data-signout-cancel]"
        );

      const signoutConfirm =
        document.querySelector(
          "[data-signout-confirm]"
        );

      signoutOpenButtons.forEach(
        (button) => {
          button.addEventListener(
            "click",
            () => {
              closeDrawer();

              if (
                signoutDialog &&
                typeof signoutDialog.showModal ===
                  "function"
              ) {
                signoutDialog.showModal();
              }
            }
          );
        }
      );

      signoutCancel?.addEventListener(
        "click",
        () => {
          signoutDialog?.close();
        }
      );

      signoutDialog?.addEventListener(
        "click",
        (event) => {
          const rect =
            signoutDialog.getBoundingClientRect();

          const clickedInside =
            event.clientX >= rect.left &&
            event.clientX <= rect.right &&
            event.clientY >= rect.top &&
            event.clientY <= rect.bottom;

          if (!clickedInside) {
            signoutDialog.close();
          }
        }
      );

      signoutConfirm?.addEventListener(
        "click",
        () => {
          window.location.href =
            "/admin/login";
        }
      );

      /* =======================================================
         ESCAPE
      ======================================================== */

      document.addEventListener(
        "keydown",
        (event) => {
          if (event.key === "Escape") {
            closeDrawer();

            if (signoutDialog?.open) {
              signoutDialog.close();
            }
          }
        }
      );
    });
  </script>
</body>
</html>
