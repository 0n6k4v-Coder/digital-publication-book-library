<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Posts — Archive</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --page: #f4f4f1;
      --sidebar: #ffffff;
      --sidebar-hover: #f6f6f3;
      --sidebar-active: #181818;
      --surface: #ffffff;
      --content: #ffffff;
      --text: #171717;
      --muted: #85857f;
      --line: #e5e5df;
      --accent: #d9ff4f;
      --danger: #c93227;
      --danger-dark: #a8241b;
      --danger-soft: #fff0ed;
      --white: #ffffff;
      --sidebar-width: 248px;
      --shell-padding: 0;
      --shell-gap: 0;
      --sidebar-radius: 0;
      --radius-sm: 10px;
      --radius-md: 14px;
      --radius-lg: 0;
      --radius-pill: 999px;
      --transition-fast: 160ms ease;
      --transition-normal: 220ms ease;
    }

    * { box-sizing: border-box; }

    html {
      min-width: 320px;
      background: var(--page);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, textarea, select { font: inherit; }
    button { border: 0; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }
    [hidden] { display: none !important; }

    .admin-shell {
      min-height: 100vh;
      padding: var(--shell-padding);
      display: grid;
      grid-template-columns: var(--sidebar-width) minmax(0, 1fr);
      gap: var(--shell-gap);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      border-top: 0;
      border-right: 1px solid var(--line);
      border-bottom: 0;
      border-left: 0;
      border-radius: var(--sidebar-radius);
      background: var(--sidebar);
      box-shadow: none;
    }

    .sidebar__brand {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 38px;
    }

    .sidebar__brand-mark {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .sidebar__brand-square {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      background: var(--accent);
      border: 1px solid #171717;
    }

    .sidebar__brand-copy {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar__brand-kicker {
      font-size: 10px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .sidebar__brand-subtitle {
      font-size: 10px;
      line-height: 1.25;
      color: var(--muted);
    }

    .sidebar__section-label {
      margin: 0 0 9px;
      padding-left: 4px;
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .sidebar__nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sidebar__nav-link {
      min-height: 42px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 8px;
      color: #65655f;
      font-size: 12px;
      font-weight: 600;
      transition:
        background var(--transition-fast),
        color var(--transition-fast);
    }

    .sidebar__nav-link:hover {
      background: var(--sidebar-hover);
      color: var(--text);
    }

    .sidebar__nav-link.active {
      background: var(--sidebar-active);
      color: var(--white);
    }

    .sidebar__nav-icon {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
    }

    .sidebar__footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sidebar__footer-link {
      min-height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 8px;
      color: #65655f;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition:
        background var(--transition-fast),
        color var(--transition-fast);
    }

    .sidebar__footer-link:hover {
      background: var(--sidebar-hover);
      color: var(--text);
    }

    .sidebar__footer-link--danger:hover {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .mobile-header {
      position: fixed;
      z-index: 80;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      height: 56px;
      padding: 0 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 0;
      border-radius: 0;
      background: rgba(255, 255, 255, 0.98);
      box-shadow: none;
      transition:
        transform var(--transition-normal),
        opacity var(--transition-normal);
    }

    .mobile-header.hidden {
      transform: translateY(-64px);
      opacity: 0;
      pointer-events: none;
    }

    .mobile-header__brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .mobile-header__square {
      width: 12px;
      height: 12px;
      flex: 0 0 auto;
      background: var(--accent);
      border: 1px solid #171717;
    }

    .mobile-header__title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .mobile-header__menu {
      width: 38px;
      height: 38px;
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #181818;
      color: #fff;
      cursor: pointer;
    }

    .mobile-drawer {
      position: fixed;
      z-index: 100;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(82vw, 310px);
      padding: 18px;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      transform: translateX(-102%);
      transition: transform var(--transition-normal);
      overflow-y: auto;
    }

    .mobile-drawer.open {
      transform: translateX(0);
    }

    .mobile-drawer__top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 38px;
    }

    .mobile-drawer__brand {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .mobile-drawer__square {
      width: 13px;
      height: 13px;
      flex: 0 0 auto;
      background: var(--accent);
      border: 1px solid #171717;
    }

    .mobile-drawer__title {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .mobile-drawer__close {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: #fff;
      color: var(--text);
      cursor: pointer;
    }

    .mobile-drawer__section-label {
      margin: 0 0 9px;
      padding-left: 4px;
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mobile-drawer__nav {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mobile-drawer__link {
      min-height: 44px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-radius: 8px;
      color: #65655f;
      background: transparent;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .mobile-drawer__link.active {
      background: var(--sidebar-active);
      color: #fff;
    }

    .mobile-drawer__bottom {
      margin-top: auto;
      padding-top: 32px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .mobile-drawer__overlay {
      position: fixed;
      z-index: 90;
      inset: 0;
      background: rgb(23 23 23 / 0.24);
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--transition-normal);
    }

    .mobile-drawer__overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .content-shell {
      min-width: 0;
      min-height: 100vh;
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      border: 0;
      border-radius: 0;
      background: #ffffff;
      overflow: hidden;
    }

    .posts-action-bar {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .posts-action-bar__title {
      margin: 0;
      font-size: 22px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: -0.035em;
    }

    .button {
      min-height: 40px;
      padding: 0 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition:
        background var(--transition-fast),
        color var(--transition-fast),
        border-color var(--transition-fast);
    }

    .button--primary {
      background: var(--text);
      color: #fff;
    }

    .button--primary:hover {
      background: #000;
    }

    .button__icon {
      width: 14px;
      height: 14px;
    }

    .posts-filter {
      min-height: 48px;
      padding: 0 2px;
      display: flex;
      align-items: stretch;
      gap: 24px;
      border-bottom: 1px solid var(--line);
      overflow-x: auto;
      scrollbar-width: none;
    }

    .posts-filter::-webkit-scrollbar {
      display: none;
    }

    .posts-filter__tab {
      position: relative;
      min-height: 48px;
      padding: 0 2px;
      display: inline-flex;
      align-items: center;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }

    .posts-filter__tab:hover {
      color: var(--text);
    }

    .posts-filter__tab.active {
      color: var(--text);
    }

    .posts-filter__tab.active::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -1px;
      height: 2px;
      background: var(--text);
    }

    .posts-workspace {
      min-height: 560px;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: var(--surface);
      overflow: visible;
    }

    .posts-workspace__header {
      min-height: 58px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px 88px;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .post-row {
      position: relative;
      min-height: 104px;
      padding: 0 24px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 140px 88px;
      align-items: center;
      gap: 20px;
      border-bottom: 1px solid var(--line);
      transition: background var(--transition-fast);
    }

    .post-row::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: 0;
      bottom: 0;
      left: -32px;
      right: -32px;
      background: var(--surface);
      pointer-events: none;
    }

    .post-row:hover::before {
      background: #fcfcfa;
    }

    .post-row > * {
      position: relative;
      z-index: 1;
    }

    .post-main {
      min-width: 0;
    }

    .post-title {
      margin: 0 0 7px;
      font-size: 14px;
      line-height: 1.35;
      font-weight: 600;
      letter-spacing: -0.012em;
    }

    .post-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 7px;
      color: var(--muted);
      font-size: 10px;
      line-height: 1.45;
    }

    .post-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #5d5d58;
      font-size: 10px;
      font-weight: 600;
    }

    .post-status__dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #242424;
    }

    .post-status--draft .post-status__dot {
      background: #b8b8b0;
    }

    .post-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 5px;
    }

    .post-action {
      width: 34px;
      height: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 9px;
      background: transparent;
      color: #777770;
      cursor: pointer;
      transition:
        background var(--transition-fast),
        color var(--transition-fast),
        border-color var(--transition-fast);
    }

    .post-action:hover {
      border-color: var(--line);
      background: #f7f7f4;
      color: var(--text);
    }

    .post-action--delete:hover {
      border-color: #f5d5cf;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .post-action svg {
      width: 15px;
      height: 15px;
    }

    .posts-pagination {
      min-height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--line);
    }

    .posts-pagination__left {
      display: flex;
      align-items: center;
      gap: 18px;
      min-width: 0;
    }

    .posts-pagination__summary {
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }

    .posts-pagination__page-size {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      white-space: nowrap;
    }

    .posts-pagination__select-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .posts-pagination__select {
      min-width: 58px;
      height: 30px;
      padding: 0 26px 0 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      appearance: none;
      -webkit-appearance: none;
      background: #fff;
      color: var(--text);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    .posts-pagination__select:hover {
      border-color: #cfcfc8;
    }

    .posts-pagination__select:focus-visible {
      border-color: var(--text);
    }

    .posts-pagination__select-icon {
      position: absolute;
      right: 8px;
      width: 12px;
      height: 12px;
      color: var(--muted);
      pointer-events: none;
    }

    .posts-pagination__controls {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .page-button {
      width: 31px;
      height: 31px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: #6f6f69;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .page-button:hover:not(:disabled) {
      border-color: var(--line);
      background: #f7f7f4;
      color: var(--text);
    }

    .page-button.active {
      border-color: var(--text);
      background: var(--text);
      color: #fff;
    }

    .page-button:disabled {
      opacity: 0.35;
      cursor: default;
    }

    .page-button svg {
      width: 13px;
      height: 13px;
    }

    .signout-dialog {
      width: min(92vw, 420px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--text);
      box-shadow:
        0 18px 44px rgb(23 23 23 / 0.12),
        0 3px 10px rgb(23 23 23 / 0.06);
    }

    .signout-dialog::backdrop {
      background: rgb(23 23 23 / 0.28);
    }

    .signout-dialog__content {
      padding: 24px;
    }

    .signout-dialog__eyebrow {
      margin-bottom: 8px;
      font-size: 9px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .signout-dialog__title {
      margin: 0 0 9px;
      font-size: 19px;
      line-height: 1.2;
      font-weight: 600;
      letter-spacing: -0.025em;
    }

    .signout-dialog__copy {
      margin: 0;
      font-size: 11px;
      line-height: 1.6;
      color: var(--muted);
    }

    .signout-dialog__actions {
      padding: 14px 24px 18px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--line);
    }

    .dialog-button {
      min-height: 36px;
      padding: 0 13px;
      border-radius: 7px;
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .dialog-button--cancel {
      background: #f5f5f2;
      color: #5d5d58;
    }

    .dialog-button--confirm {
      background: var(--danger);
      color: #fff;
    }

    .dialog-button--confirm:hover {
      background: var(--danger-dark);
    }

    @media (max-width: 820px) {
      .admin-shell {
        display: block;
        min-height: 100vh;
        padding: 0;
      }

      .sidebar {
        display: none;
      }

      .mobile-header {
        display: flex;
      }

      .content-shell {
        min-height: 100vh;
        padding: 74px 16px 24px;
        border: 0;
        border-radius: 0;
        background: #fff;
        gap: 18px;
      }

      .posts-action-bar {
        min-height: 42px;
      }

      .posts-action-bar__title {
        font-size: 20px;
      }

      .posts-filter {
        min-height: 46px;
        gap: 20px;
      }

      .posts-filter__tab {
        min-height: 46px;
      }

      .posts-workspace__header {
        padding: 0 18px;
        grid-template-columns: minmax(0, 1fr) 110px 76px;
        gap: 16px;
      }

      .post-row {
        min-height: 96px;
        padding: 0 18px;
        grid-template-columns: minmax(0, 1fr) 110px 76px;
        gap: 16px;
      }

      .post-row::before {
        left: -16px;
        right: -16px;
      }

      .post-actions {
        display: flex;
      }

      .posts-pagination {
        min-height: 60px;
        padding: 0 18px;
      }

      .posts-pagination__left {
        gap: 12px;
      }
    }

    @media (max-width: 620px) {
      .posts-pagination {
        align-items: flex-start;
        flex-direction: column;
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .posts-pagination__left {
        width: 100%;
        justify-content: space-between;
      }

      .posts-pagination__controls {
        width: 100%;
        justify-content: flex-end;
      }
    }

    @media (max-width: 520px) {
      .mobile-header {
        height: 54px;
        padding: 0 12px;
      }

      .content-shell {
        padding: 70px 12px 20px;
        background: #fff;
      }

      .posts-action-bar__title {
        font-size: 19px;
      }

      .button {
        min-height: 38px;
        padding: 0 13px;
      }

      .posts-filter {
        min-height: 44px;
        gap: 18px;
      }

      .posts-filter__tab {
        min-height: 44px;
      }

      .posts-workspace__header {
        min-height: 50px;
        padding: 0 14px;
        grid-template-columns: minmax(0, 1fr) auto 70px;
        gap: 12px;
      }

      .post-row {
        min-height: 92px;
        padding: 0 14px;
        grid-template-columns: minmax(0, 1fr) auto 70px;
        gap: 12px;
      }

      .post-row::before {
        left: -12px;
        right: -12px;
      }

      .post-action {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }

      .posts-pagination {
        min-height: 58px;
        padding-left: 14px;
        padding-right: 14px;
      }

      .posts-pagination__summary,
      .posts-pagination__page-size {
        font-size: 9px;
      }

      .posts-pagination__select {
        height: 29px;      }

      .page-button {
        width: 29px;
        height: 29px;
      }
    }

    @media (max-width: 400px) {
      .mobile-header {
        height: 52px;
        padding: 0 10px;
      }

      .content-shell {
        padding-top: 68px;
      }

      .posts-action-bar {
        gap: 10px;
      }

      .posts-action-bar__title {
        font-size: 18px;
      }

      .button {
        padding: 0 11px;
      }

      .post-title {
        font-size: 13px;
      }

      .post-meta,
      .post-status {
        font-size: 9px;
      }

      .posts-pagination__controls {
        gap: 2px;
      }

      .page-button:nth-last-child(2) {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="admin-shell">

    <aside class="sidebar" aria-label="Admin navigation">
      <div>
        <div class="sidebar__brand">
          <div class="sidebar__brand-mark">
            <span class="sidebar__brand-square" aria-hidden="true"></span>
            <div class="sidebar__brand-copy">
              <div class="sidebar__brand-kicker">Archive / 01</div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const posts = [
        { id: 1, title: "Getting Started with the Archive", status: "published", dateLabel: "Published September 18, 2026" },
        { id: 2, title: "Design Notes for Issue 04", status: "draft", dateLabel: "Updated September 12, 2026" },
        { id: 3, title: "The Future of Digital Publishing", status: "published", dateLabel: "Published September 05, 2026" },
        { id: 4, title: "Building a Digital Reading Room", status: "published", dateLabel: "Published August 28, 2026" },
        { id: 5, title: "Notes on Preserving Digital Editions", status: "draft", dateLabel: "Updated August 21, 2026" },
        { id: 6, title: "Rethinking the Digital Book Cover", status: "published", dateLabel: "Published August 16, 2026" },
        { id: 7, title: "A Small Guide to Editorial Systems", status: "published", dateLabel: "Published August 10, 2026" },
        { id: 8, title: "Reading Interfaces and Quiet Spaces", status: "draft", dateLabel: "Updated August 04, 2026" },
        { id: 9, title: "How We Organize the Collection", status: "published", dateLabel: "Published July 29, 2026" },
        { id: 10, title: "Typography for Long-Form Reading", status: "published", dateLabel: "Published July 22, 2026" },
        { id: 11, title: "Archive Notes: Summer 2026", status: "draft", dateLabel: "Updated July 16, 2026" },
        { id: 12, title: "Making Metadata Feel Human", status: "published", dateLabel: "Published July 09, 2026" },
        { id: 13, title: "The Case for Slower Interfaces", status: "published", dateLabel: "Published July 02, 2026" },
        { id: 14, title: "Notes from the Reading Room", status: "draft", dateLabel: "Updated June 26, 2026" },
        { id: 15, title: "Digital Editions as Cultural Objects", status: "published", dateLabel: "Published June 19, 2026" },
        { id: 16, title: "Designing Around the Margins", status: "published", dateLabel: "Published June 12, 2026" },
        { id: 17, title: "A Practical Guide to Issue Planning", status: "draft", dateLabel: "Updated June 05, 2026" },
        { id: 18, title: "The Shape of an Online Archive", status: "published", dateLabel: "Published May 29, 2026" },
        { id: 19, title: "What Makes a Collection Discoverable", status: "published", dateLabel: "Published May 21, 2026" },
        { id: 20, title: "Editorial Rhythm in Digital Publishing", status: "draft", dateLabel: "Updated May 14, 2026" },
        { id: 21, title: "On Designing for Returning Readers", status: "published", dateLabel: "Published May 07, 2026" },
        { id: 22, title: "Keeping the Archive Legible", status: "published", dateLabel: "Published April 30, 2026" },
        { id: 23, title: "Notes on Digital Preservation", status: "draft", dateLabel: "Updated April 23, 2026" },
        { id: 24, title: "Building a Sustainable Reading Library", status: "published", dateLabel: "Published April 16, 2026" },
        { id: 25, title: "The Editorial Work Behind the Interface", status: "published", dateLabel: "Published April 09, 2026" },
        { id: 26, title: "Designing Better Archive Navigation", status: "draft", dateLabel: "Updated April 02, 2026" },
        { id: 27, title: "Looking Back at Issue 03", status: "published", dateLabel: "Published March 26, 2026" }
      ];

      const editIcon = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L8 18l-4 1 1-4 12.5-11.5Z"></path>
        </svg>
      `;

      const deleteIcon = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 6h18"></path>
          <path d="M8 6V4h8v2"></path>
          <path d="M19 6l-1 15H6L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
        </svg>
      `;

      const previousIcon = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"></path>
        </svg>
      `;

      const nextIcon = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M9 18l6-6-6-6"></path>
        </svg>
      `;

      let activeFilter = "all";
      let currentPage = 1;
      let rowsPerPage = 5;

      const list = document.querySelector("#posts-list");
      const filterTabs = Array.from(document.querySelectorAll(".posts-filter__tab"));
      const rowsPerPageSelect = document.querySelector("[data-rows-per-page]");
      const paginationSummary = document.querySelector("[data-pagination-summary]");
      const paginationControls = document.querySelector("[data-pagination-controls]");

      function getFilteredPosts() {
        if (activeFilter === "all") return posts;
        return posts.filter((post) => post.status === activeFilter);
      }

      function createPostRow(post) {
        const article = document.createElement("article");
        article.className = "post-row";
        article.dataset.status = post.status;

        const statusLabel = post.status === "published" ? "Published" : "Draft";

        article.innerHTML = `
          <div class="post-main">
            <h2 class="post-title">${escapeHtml(post.title)}</h2>
            <div class="post-meta">
              <span>${escapeHtml(post.dateLabel)}</span>
            </div>
          </div>

          <div class="post-status ${post.status === "draft" ? "post-status--draft" : ""}">
            <span class="post-status__dot" aria-hidden="true"></span>
            <span>${statusLabel}</span>
          </div>

          <div class="post-actions">
            <a
              class="post-action"
              href="/admin/posts/${post.id}/edit"
              aria-label="Edit ${escapeAttribute(post.title)}"
              title="Edit"
            >
              ${editIcon}
            </a>

            <button
              class="post-action post-action--delete"
              type="button"
              aria-label="Delete ${escapeAttribute(post.title)}"
              title="Delete"
              data-delete-post="${post.id}"
            >
              ${deleteIcon}
            </button>
          </div>
        `;

        return article;
      }

      function renderPosts() {
        const filteredPosts = getFilteredPosts();
        const totalPages = Math.max(1, Math.ceil(filteredPosts.length / rowsPerPage));

        if (currentPage > totalPages) currentPage = totalPages;

        const startIndex = (currentPage - 1) * rowsPerPage;
        const visiblePosts = filteredPosts.slice(startIndex, startIndex + rowsPerPage);

        list.innerHTML = "";
        visiblePosts.forEach((post) => list.appendChild(createPostRow(post)));

        renderSummary(filteredPosts.length, startIndex, visiblePosts.length);
        renderPagination(totalPages);
        bindDeleteActions();
      }

      function renderSummary(total, startIndex, visibleCount) {
        if (total === 0) {
          paginationSummary.textContent = "0 of 0";
          return;
        }

        const from = startIndex + 1;
        const to = startIndex + visibleCount;
        paginationSummary.textContent = `${from}–${to} of ${total}`;
      }

      function renderPagination(totalPages) {
        paginationControls.innerHTML = "";

        const previousButton = document.createElement("button");
        previousButton.className = "page-button";
        previousButton.type = "button";
        previousButton.setAttribute("aria-label", "Previous page");
        previousButton.disabled = currentPage === 1;
        previousButton.innerHTML = previousIcon;

        previousButton.addEventListener("click", () => {
          if (currentPage > 1) {
            currentPage -= 1;
            renderPosts();
          }
        });

        paginationControls.appendChild(previousButton);

        const pageWindow = buildPageWindow(totalPages, currentPage);

        pageWindow.forEach((page) => {
          const pageButton = document.createElement("button");
          pageButton.className = "page-button";
          pageButton.type = "button";
          pageButton.textContent = page;

          if (page === currentPage) {
            pageButton.classList.add("active");
            pageButton.setAttribute("aria-current", "page");
          }

          pageButton.addEventListener("click", () => {
            currentPage = page;
            renderPosts();
          });

          paginationControls.appendChild(pageButton);
        });

        const nextButton = document.createElement("button");
        nextButton.className = "page-button";
        nextButton.type = "button";
        nextButton.setAttribute("aria-label", "Next page");
        nextButton.disabled = currentPage === totalPages;
        nextButton.innerHTML = nextIcon;

        nextButton.addEventListener("click", () => {
          if (currentPage < totalPages) {
            currentPage += 1;
            renderPosts();
          }
        });

        paginationControls.appendChild(nextButton);
      }

      function buildPageWindow(totalPages, activePage) {
        if (totalPages <= 5) {
          return Array.from({ length: totalPages }, (_, index) => index + 1);
        }

        const pages = new Set([
          1,
          totalPages,
          activePage,
          activePage - 1,
          activePage + 1
        ]);

        return Array.from(pages)
          .filter((page) => page >= 1 && page <= totalPages)
          .sort((a, b) => a - b);
      }

      function bindDeleteActions() {
        const deleteButtons = document.querySelectorAll("[data-delete-post]");

        deleteButtons.forEach((button) => {
          button.addEventListener("click", () => {
            const postId = Number(button.dataset.deletePost);
            const index = posts.findIndex((post) => post.id === postId);

            if (index !== -1) {
              posts.splice(index, 1);
              renderPosts();
            }
          });
        });
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function escapeAttribute(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll('"', "&quot;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;");
      }

      filterTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          activeFilter = tab.dataset.filter;
          currentPage = 1;

          filterTabs.forEach((item) => {
            const isActive = item === tab;
            item.classList.toggle("active", isActive);
            item.setAttribute("aria-selected", String(isActive));
          });

          renderPosts();
        });
      });

      rowsPerPageSelect?.addEventListener("change", (event) => {
        const nextValue = Number(event.target.value);

        if (!Number.isFinite(nextValue) || nextValue <= 0) return;

        rowsPerPage = nextValue;
        currentPage = 1;
        renderPosts();
      });

      const drawer = document.querySelector("[data-mobile-drawer]");
      const overlay = document.querySelector("[data-drawer-overlay]");
      const openButton = document.querySelector("[data-menu-open]");
      const closeButton = document.querySelector("[data-menu-close]");

      function openDrawer() {
        if (!drawer || !overlay) return;

        drawer.classList.add("open");
        overlay.classList.add("open");
        drawer.setAttribute("aria-hidden", "false");
        openButton?.setAttribute("aria-expanded", "true");
        document.body.style.overflow = "hidden";
      }

      function closeDrawer() {
        if (!drawer || !overlay) return;

        drawer.classList.remove("open");
        overlay.classList.remove("open");
        drawer.setAttribute("aria-hidden", "true");
        openButton?.setAttribute("aria-expanded", "false");
        document.body.style.overflow = "";
      }

      openButton?.addEventListener("click", openDrawer);
      closeButton?.addEventListener("click", closeDrawer);
      overlay?.addEventListener("click", closeDrawer);

      window.addEventListener("resize", () => {
        if (window.innerWidth > 820) closeDrawer();
      });

      const mobileHeader = document.querySelector("[data-mobile-header]");
      let lastScrollY = window.scrollY;

      window.addEventListener(
        "scroll",
        () => {
          if (!mobileHeader || window.innerWidth > 820) return;

          const currentScrollY = window.scrollY;

          if (currentScrollY <= 4) {
            mobileHeader.classList.remove("hidden");
          } else if (currentScrollY > lastScrollY + 4) {
            mobileHeader.classList.add("hidden");
          } else if (currentScrollY < lastScrollY - 4) {
            mobileHeader.classList.remove("hidden");
          }

          lastScrollY = currentScrollY;
        },
        { passive: true }
      );

      const signoutDialog = document.querySelector("[data-signout-dialog]");
      const signoutOpenButtons = document.querySelectorAll("[data-signout-open]");
      const signoutCancel = document.querySelector("[data-signout-cancel]");
      const signoutConfirm = document.querySelector("[data-signout-confirm]");

      signoutOpenButtons.forEach((button) => {
        button.addEventListener("click", () => {
          closeDrawer();

          if (
            signoutDialog &&
            typeof signoutDialog.showModal === "function"
          ) {
            signoutDialog.showModal();
          }
        });
      });

      signoutCancel?.addEventListener("click", () => {
        signoutDialog?.close();
      });

      signoutDialog?.addEventListener("click", (event) => {
        const rect = signoutDialog.getBoundingClientRect();

        const clickedInside =
          event.clientX >= rect.left &&
          event.clientX <= rect.right &&
          event.clientY >= rect.top &&
          event.clientY <= rect.bottom;

        if (!clickedInside) signoutDialog.close();
      });

      signoutConfirm?.addEventListener("click", () => {
        window.location.href = "/admin/login";
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeDrawer();
      });

      renderPosts();
    });
  </script>
