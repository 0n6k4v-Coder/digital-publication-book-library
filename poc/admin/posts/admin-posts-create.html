<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Archive — Post Editor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --surface: #fff;
      --surface-soft: #f7f7f4;
      --surface-active: #f1f1ec;
      --text: #171717;
      --body-text: #2b2b28;
      --muted: #85857f;
      --placeholder: #aaa9a2;
      --line: #e5e5df;
      --line-strong: #d2d2cb;
      --accent: #d9ff4f;
      --accent-border: #bedf3c;
      --accent-hover: #d0f447;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --topbar-content-height: 64px;
      --topbar-height: calc(var(--topbar-content-height) + var(--safe-top));
      --tools-height: 56px;
      --page-padding: clamp(8px, 4vw, 24px);
      --content-width: 820px;
      --body-width: 720px;
      --control-height: 40px;
      --back-size: 44px;
      --title-size: clamp(30px, 6.5vw, 48px);
      --subtitle-size: clamp(18px, 3.4vw, 24px);
      --body-size: clamp(17px, 2.4vw, 19px);
      --tool-size: 36px;
      --tool-icon-size: 20px;
      --tool-text-size: 14px;
      --tool-gap: 8px;
      --radius-sm: 8px;
      --radius-md: 10px;
      --transition-fast: 160ms ease;
      --shadow-menu: 0 16px 36px rgb(23 23 23 / .12), 0 3px 10px rgb(23 23 23 / .05);
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    html,
    body {
      min-width: 320px;
      min-height: 100%;
      margin: 0;
      background: var(--surface);
    }

    html { overflow-x: clip; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow-x: clip;
    }

    button,
    input { font: inherit; }

    button { border: 0; }
    a { color: inherit; text-decoration: none; }
    svg { display: block; }

    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 3px;
    }

    .post-body,
    .post-body:focus,
    .post-body:focus-visible {
      outline: none !important;
      border: 0 !important;
      box-shadow: none !important;
    }

    .writing-workspace {
      min-height: 100vh;
      min-height: 100svh;
      min-height: 100dvh;
      background: var(--surface);
    }

    .writing-topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      min-height: var(--topbar-height);
      padding-top: var(--safe-top);
      padding-inline: max(var(--page-padding), var(--safe-left)) max(var(--page-padding), var(--safe-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: rgb(255 255 255 / .96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .writing-topbar__left,
    .writing-topbar__right {
      min-width: 0;
      display: flex;
      align-items: center;
    }

    .writing-topbar__right {
      justify-content: flex-end;
      gap: 8px;
    }

    .back-button {
      width: var(--back-size);
      min-width: var(--back-size);
      height: var(--back-size);
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }

    .back-button:hover {
      border-color: var(--line);
      background: var(--surface-soft);
    }

    .back-button__icon { width: 19px; height: 19px; }

    .preview-button {
      min-height: var(--control-height);
      padding-inline: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: #5e5e58;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }

    .preview-button:hover {
      border-color: var(--line-strong);
      background: var(--surface-soft);
      color: var(--text);
    }

    .preview-button__icon {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .status-action {
      position: relative;
      display: inline-flex;
      align-items: stretch;
    }

    .status-action__main,
    .status-action__menu {
      min-height: var(--control-height);
      cursor: pointer;
      transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
    }

    .status-action__main {
      min-width: 92px;
      padding-inline: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--accent-border);
      border-right: 0;
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      background: var(--accent);
      color: #181818;
      font-size: 11px;
      line-height: 1;
      font-weight: 700;
      white-space: nowrap;
    }

    .status-action__main:hover {
      border-color: #aed12f;
      background: var(--accent-hover);
    }

    .status-action__main--draft {
      border-color: var(--text);
      background: var(--text);
      color: #fff;
    }

    .status-action__main--draft:hover {
      border-color: #000;
      background: #000;
    }

    .status-action__icon {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
    }

    .status-action__menu {
      width: 34px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--accent-border);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      background: var(--accent);
      color: #181818;
    }

    .status-action__menu:hover {
      border-color: #aed12f;
      background: var(--accent-hover);
    }

    .status-action__main--draft + .status-action__menu {
      border-color: var(--text);
      background: var(--text);
      color: #fff;
    }

    .status-action__main--draft + .status-action__menu:hover {
      border-color: #000;
      background: #000;
    }

    .status-action__menu-icon { width: 14px; height: 14px; }

    .status-action__popup,
    .menu-popup {
      position: fixed;
      z-index: 400;
      width: max-content;
      min-width: 180px;
      max-width: calc(100vw - 16px);
      max-height: calc(100dvh - 16px);
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-menu);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      pointer-events: none;
      overflow-y: auto;
      transition: opacity var(--transition-fast), transform var(--transition-fast), visibility var(--transition-fast);
    }

    .status-action__popup.is-open,
    .menu-popup.is-open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      pointer-events: auto;
    }

    .status-action__popup-label {
      padding: 5px 10px 4px;
      color: var(--muted);
      font-size: 8px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /*
     * Publish / Save As Draft options deliberately match the
     * toolbar dropdown options: 40px high, 20px icon,
     * 14px / 500 text, same neutral text color.
     * Option buttons themselves are borderless.
     */
    .status-action__option,
    .menu-option {
      width: 100%;
      min-height: 40px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0 !important;
      outline: none;
      border-radius: 7px;
      background: transparent;
      color: #666660;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .status-action__option:hover,
    .status-action__option:focus-visible,
    .menu-option:hover,
    .menu-option:focus-visible {
      border: 0 !important;
      outline: none;
      background: var(--surface-soft);
      color: var(--text);
      box-shadow: none;
    }

    .status-action__option.is-active,
    .menu-option.is-active {
      border: 0 !important;
      background: var(--surface-active);
      color: var(--text);
    }

    .status-action__option.is-active:hover,
    .status-action__option.is-active:focus-visible,
    .menu-option.is-active:hover,
    .menu-option.is-active:focus-visible {
      border: 0 !important;
      background: #ecece7;
    }

    .status-action__option-icon,
    .menu-option__icon {
      width: 20px;
      height: 20px;
      flex: 0 0 auto;
      color: currentColor;
    }

    .status-action__option-copy {
      min-width: 0;
      flex: 1 1 auto;
      display: block;
    }

    .status-action__option-title {
      color: currentColor;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 500;
      white-space: nowrap;
    }

    .status-action__option-description { display: none; }

    .menu-option__label,
    .style-option__label {
      min-width: 0;
      flex: 1 1 auto;
      color: currentColor;
      font-size: 14px;
      line-height: 1.2;
      font-weight: 500;
    }

    .menu-option__check {
      width: 16px;
      height: 16px;
      margin-left: auto;
      flex: 0 0 auto;
      opacity: 0;
      color: currentColor;
    }

    .menu-option.is-active .menu-option__check {
      opacity: 1;
    }

    .writing-tools {
      position: sticky;
      top: var(--topbar-height);
      z-index: 90;
      width: 100%;
      min-height: var(--tools-height);
      padding-inline: max(8px, var(--safe-left)) max(8px, var(--safe-right));
      background: var(--surface);
      overflow-x: auto;
      overflow-y: visible;
      overscroll-behavior-x: contain;
      scrollbar-width: none;
    }

    .writing-tools::-webkit-scrollbar { display: none; }

    .writing-tools__inner {
      width: max-content;
      min-width: 100%;
      min-height: var(--tools-height);
      padding-block: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--tool-gap);
      white-space: nowrap;
    }

    .writing-tool {
      position: relative;
      width: var(--tool-size);
      min-width: var(--tool-size);
      height: var(--tool-size);
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: #666660;
      font-size: var(--tool-text-size);
      line-height: 1;
      font-weight: 500;
      cursor: pointer;
      transition: background var(--transition-fast), color var(--transition-fast);
    }

    .writing-tool:hover,
    .writing-tool.is-open {
      background: var(--surface-soft);
      color: var(--text);
    }

    .writing-tool__icon {
      width: var(--tool-icon-size);
      height: var(--tool-icon-size);
      flex: 0 0 auto;
      color: currentColor;
    }

    .writing-tool__label {
      font-size: var(--tool-text-size);
      line-height: 1;
      font-weight: 500;
    }

    .writing-tool__chevron {
      width: 14px;
      height: 14px;
      flex: 0 0 auto;
    }

    .writing-tool__color-bar {
      position: absolute;
      left: 50%;
      bottom: 4px;
      width: 12px;
      height: 3px;
      border-radius: 2px;
      transform: translateX(-50%);
      background: #171717;
    }

    .writing-tool__color-bar--highlight {
      background: #d9ff4f;
    }

    .writing-tool--style,
    .writing-tool--dropdown {
      width: auto;
      min-width: auto;
      padding-inline: 8px;
    }

    .writing-canvas {
      min-height: calc(100dvh - var(--topbar-height) - var(--tools-height));
      padding:
        clamp(32px, 7vw, 64px)
        max(var(--page-padding), var(--safe-right))
        clamp(72px, 10vw, 120px)
        max(var(--page-padding), var(--safe-left));
      background: var(--surface);
    }

    .post-editor {
      width: min(100%, var(--content-width));
      margin-inline: auto;
      display: flex;
      flex-direction: column;
    }

    .post-field__label {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .post-title,
    .post-subtitle {
      width: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      font-family: inherit;
      caret-color: var(--text);
    }

    .post-title {
      color: var(--text);
      font-size: var(--title-size);
      line-height: 1.08;
      font-weight: 700;
      letter-spacing: -.035em;
    }

    .post-title::placeholder,
    .post-subtitle::placeholder {
      color: var(--placeholder);
      opacity: 1;
    }

    .post-subtitle {
      margin-top: 18px;
      color: #60605a;
      font-size: var(--subtitle-size);
      line-height: 1.4;
      font-weight: 400;
      letter-spacing: -.015em;
    }

    .post-body {
      width: min(100%, var(--body-width));
      height: auto;
      min-height: 0;
      max-height: none;
      margin-top: 48px;
      padding: 0;
      border: 0;
      outline: none;
      box-shadow: none;
      color: var(--body-text);
      font-family: inherit;
      font-size: var(--body-size);
      line-height: 1.75;
      font-weight: 400;
      letter-spacing: -.005em;
      caret-color: var(--text);
      white-space: pre-wrap;
      overflow-wrap: break-word;
      cursor: text;
    }

    .post-body:empty::before {
      content: attr(data-placeholder);
      display: block;
      width: 100%;
      color: var(--placeholder);
      text-align: left !important;
      pointer-events: none;
      white-space: normal;
    }

    .post-body p { margin: 0 0 1.25em; }
    .post-body p:last-child { margin-bottom: 0; }

    .post-body h1,
    .post-body h2,
    .post-body h3,
    .post-body h4,
    .post-body h5,
    .post-body h6,
    .post-body blockquote,
    .post-body ul,
    .post-body ol {
      margin-block-start: 0;
      margin-block-end: 1em;
    }

    .post-body blockquote {
      padding-left: 20px;
      border-left: 3px solid var(--line-strong);
      color: #55554f;
    }

    @media (max-width: 900px) {
      .writing-tools__inner { justify-content: flex-start; }
    }

    @media (max-width: 640px) {
      :root {
        --topbar-content-height: 58px;
        --tools-height: 54px;
        --page-padding: 12px;
      }

      .writing-topbar { gap: 10px; }
      .writing-topbar__right { gap: 6px; }
      .back-button { border-radius: 7px; }

      .preview-button {
        min-height: 40px;
        padding-inline: 12px;
        gap: 7px;
        font-size: 10px;
      }

      .status-action__main {
        min-height: 40px;
        min-width: 88px;
        padding-inline: 12px;
        gap: 7px;
        font-size: 10px;
      }

      .status-action__menu {
        width: 32px;
        min-height: 40px;
      }

      .writing-tools { padding-inline: 8px; }
      .writing-tools__inner { min-height: 54px; padding-block: 9px; }
      .writing-canvas { padding-top: 40px; padding-bottom: 72px; }
      .post-subtitle { margin-top: 14px; }
      .post-body { margin-top: 36px; }
    }

    @media (max-width: 460px) {
      :root {
        --page-padding: 8px;
        --title-size: 32px;
        --subtitle-size: 19px;
        --body-size: 17px;
      }

      .writing-topbar__right { gap: 5px; }
      .preview-button { padding-inline: 10px; }
      .status-action__main { min-width: 84px; padding-inline: 10px; }
      .status-action__menu { width: 30px; }
      .writing-canvas { padding-top: 34px; }
      .post-body { margin-top: 32px; }
    }

    @media (max-width: 380px) {
      .preview-button__icon { display: none; }
      .preview-button { padding-inline: 11px; }

      .status-action__main {
        min-width: 80px;
        padding-inline: 9px;
        font-size: 9.5px;
      }

      .status-action__main .status-action__icon { display: none; }
      .status-action__menu { width: 30px; }

      .post-title { font-size: 30px; }
      .post-subtitle { font-size: 18px; }
      .post-body { font-size: 17px; line-height: 1.7; }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>

<body>
  <div class="writing-workspace">

    <header class="writing-topbar" aria-label="Post editor actions">
      <div class="writing-topbar__left">
        <a class="back-button" href="/admin/posts" aria-label="Back to posts">
          <svg class="back-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M15 18l-6-6 6-6"></path>
          </svg>
        </a>
      </div>

      <div class="writing-topbar__right">
        <button class="preview-button" type="button" aria-label="Preview post" data-preview-button>
          <svg class="preview-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M2.5 12s3.5-6 9.5-6s9.5 6 9.5 6s-3.5 6-9.5 6s-9.5-6-9.5-6Z"></path>
            <circle cx="12" cy="12" r="2.5"></circle>
          </svg>
          <span>Preview</span>
        </button>

        <div class="status-action" data-status-action>
          <button class="status-action__main" type="button" data-status-main aria-label="Publish post">
            <svg class="status-action__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" data-status-main-icon>
              <path d="M22 2L11 13"></path>
              <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
            </svg>
            <span data-status-main-label>Publish</span>
          </button>

          <button class="status-action__menu" type="button" aria-label="Change post action" aria-haspopup="menu" aria-expanded="false" data-status-menu-button>
            <svg class="status-action__menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M7 10l5 5l5-5"></path>
            </svg>
          </button>

          <div class="status-action__popup" role="menu" aria-label="Post action" data-status-menu>
            <div class="status-action__popup-label">Action</div>

            <button class="status-action__option is-active" type="button" role="menuitemradio" aria-checked="true" data-action-option="publish">
              <svg class="status-action__option-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M22 2L11 13"></path>
                <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
              </svg>
              <span class="status-action__option-copy">
                <span class="status-action__option-title">Publish</span>
              </span>
              <svg class="menu-option__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12.5l4 4L19 7"></path>
              </svg>
            </button>

            <button class="status-action__option" type="button" role="menuitemradio" aria-checked="false" data-action-option="draft">
              <svg class="status-action__option-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 4H16L19 7V20H5Z"></path>
                <path d="M8 4V10H16V4"></path>
                <path d="M8 20V14H16V20"></path>
              </svg>
              <span class="status-action__option-copy">
                <span class="status-action__option-title">Save As Draft</span>
              </span>
              <svg class="menu-option__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M5 12.5l4 4L19 7"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <nav class="writing-tools" aria-label="Writing tools">
      <div class="writing-tools__inner">

        <button class="writing-tool" type="button" aria-label="Undo" data-tool-action="undo">
          <svg class="writing-tool__icon" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true">
            <path d="M288-192v-72h288q50 0 85-35t35-85q0-50-35-85t-85-35H330l93 93-51 51-180-180 180-180 51 51-93 93h246q80 0 136 56t56 136q0 80-56 136t-136 56H288Z"></path>
          </svg>
        </button>

        <svg class="menu-option__icon" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M144-744v-72h672v72H144Zm192 150v-72h480v72H336ZM144-444v-72h672v72H144Zm192 150v-72h480v72H336ZM144-144v-72h672v72H144Z"></path></svg>
        <span class="menu-option__label">Left</span>
        <svg class="menu-option__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4 4L19 7"></path></svg>
      </button>
      <button class="menu-option" type="button" role="menuitemradio" aria-checked="false" data-alignment-option="center">
        <svg class="menu-option__icon" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M144-144v-72h672v72H144Zm144-150v-72h384v72H288ZM144-444v-72h672v72H144Zm144-150v-72h384v72H288ZM144-744v-72h672v72H144Z"></path></svg>
        <span class="menu-option__label">Center</span>
        <svg class="menu-option__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4 4L19 7"></path></svg>
      </button>
      <button class="menu-option" type="button" role="menuitemradio" aria-checked="false" data-alignment-option="right">
        <svg class="menu-option__icon" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M144-744v-72h672v72H144Zm192 150v-72h480v72H336ZM144-444v-72h672v72H144Zm192 150v-72h480v72H336ZM144-144v-72h672v72H144Z"></path></svg>
        <span class="menu-option__label">Right</span>
        <svg class="menu-option__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4 4L19 7"></path></svg>
      </button>
      <button class="menu-option" type="button" role="menuitemradio" aria-checked="false" data-alignment-option="justify">
        <svg class="menu-option__icon" viewBox="0 -960 960 960" fill="currentColor" aria-hidden="true"><path d="M144-144v-72h672v72H144Zm0-150v-72h672v72H144Zm0-150v-72h672v72H144Zm0-150v-72h672v72H144Zm0-150v-72h672v72H144Z"></path></svg>
        <span class="menu-option__label">Justify</span>
        <svg class="menu-option__check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4 4L19 7"></path></svg>
      </button>
    </div>

    <main class="writing-canvas" aria-label="Create post">
      <article class="post-editor">

        <label class="post-field__label" for="post-title">Title</label>
        <input class="post-title" id="post-title" name="title" type="text" placeholder="Title" autocomplete="off" data-post-title>

        <label class="post-field__label" for="post-subtitle">Subtitle</label>
        <input class="post-subtitle" id="post-subtitle" name="subtitle" type="text" placeholder="Subtitle" autocomplete="off" data-post-subtitle>

        <div
          class="post-body"
          id="post-body"
          role="textbox"
          contenteditable="true"
          aria-multiline="true"
          aria-label="Post body"
          data-placeholder="Start writing your posts..."
          data-post-body
        ></div>

      </article>
    </main>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const statusAction = document.querySelector("[data-status-action]");
      const statusMain = document.querySelector("[data-status-main]");
      const statusMainIcon = document.querySelector("[data-status-main-icon]");
      const statusMainLabel = document.querySelector("[data-status-main-label]");
      const statusMenuButton = document.querySelector("[data-status-menu-button]");
      const statusMenu = document.querySelector("[data-status-menu]");
      const actionOptions = document.querySelectorAll("[data-action-option]");
      const menuButtons = document.querySelectorAll("[data-menu-button]");
      const menus = document.querySelectorAll("[data-menu]");
      const titleInput = document.querySelector("[data-post-title]");
      const subtitleInput = document.querySelector("[data-post-subtitle]");
      const postBody = document.querySelector("[data-post-body]");
      const alignmentButton = document.querySelector('[data-menu-button="alignment"]');
      const alignmentIcon = document.querySelector("[data-align-current-icon]");
      const alignmentOptions = document.querySelectorAll("[data-alignment-option]");
      const styleOptions = document.querySelectorAll("[data-style]");
      const scriptOptions = document.querySelectorAll("[data-script]");
      const textColorOptions = document.querySelectorAll("[data-text-color]");
      const highlightOptions = document.querySelectorAll("[data-highlight-color]");
      const mediaOptions = document.querySelectorAll("[data-media-option]");

      let selectedAction = "publish";
      let selectedStyle = "normal";
      let selectedScript = "normal";
      let selectedTextColor = "#171717";
      let selectedHighlightColor = "#d9ff4f";
      let selectedAlignment = "left";
      let openMenuName = null;

      const alignmentPaths = {
        left: "M144-744v-72h672v72H144Zm192 150v-72h480v72H336ZM144-444v-72h672v72H144Zm192 150v-72h480v72H336ZM144-144v-72h672v72H144Z",
        center: "M144-144v-72h672v72H144Zm144-150v-72h384v72H288ZM144-444v-72h672v72H144Zm144-150v-72h384v72H288ZM144-744v-72h672v72H144Z",
        right: "M144-744v-72h672v72H144Zm192 150v-72h480v72H336ZM144-444v-72h672v72H144Zm192 150v-72h480v72H336ZM144-144v-72h672v72H144Z",
        justify: "M144-144v-72h672v72H144Zm0-150v-72h672v72H144Zm0-150v-72h672v72H144Zm0-150v-72h672v72H144Zm0-150v-72h672v72H144Z"
      };

      function clamp(value, min, max) {
        return Math.min(Math.max(value, min), max);
      }

      function viewportWidth() {
        return window.visualViewport ? window.visualViewport.width : window.innerWidth;
      }

      function viewportHeight() {
        return window.visualViewport ? window.visualViewport.height : window.innerHeight;
      }

      function positionMenu(button, menu) {
        const rect = button.getBoundingClientRect();
        const width = viewportWidth();
        const height = viewportHeight();
        const menuWidth = Math.min(Math.max(menu.offsetWidth || 180, 180), width - 16);
        const menuHeight = Math.min(menu.offsetHeight || 180, height - 16);
        const gap = 8;
        const left = clamp(rect.left + rect.width / 2 - menuWidth / 2, 8, width - menuWidth - 8);
        const below = height - rect.bottom - gap;
        const above = rect.top - gap;
        const openAbove = below < menuHeight && above >= menuHeight;
        const top = openAbove ? rect.top - menuHeight - gap : rect.bottom + gap;

        menu.style.left = `${left}px`;
        menu.style.top = `${Math.max(8, Math.min(top, height - menuHeight - 8))}px`;
      }

      function getMenu(name) {
        return document.querySelector(`[data-menu="${name}"]`);
      }

      function closeToolbarMenus() {
        menus.forEach((menu) => menu.classList.remove("is-open"));

        menuButtons.forEach((button) => {
          button.classList.remove("is-open");
          button.setAttribute("aria-expanded", "false");
        });

        openMenuName = null;
      }

      function closeStatusMenu() {
        statusMenu.classList.remove("is-open");
        statusMenuButton.setAttribute("aria-expanded", "false");
      }

      function closeAllMenus() {
        closeToolbarMenus();
        closeStatusMenu();
      }

      function openToolbarMenu(name) {
        const button = document.querySelector(`[data-menu-button="${name}"]`);
        const menu = getMenu(name);

        if (!button || !menu) return;

        closeAllMenus();

        menu.classList.add("is-open");
        button.classList.add("is-open");
        button.setAttribute("aria-expanded", "true");
        openMenuName = name;

        positionMenu(button, menu);
      }

      function toggleToolbarMenu(name) {
        if (openMenuName === name) {
          closeToolbarMenus();
          return;
        }

        openToolbarMenu(name);
      }

      function repositionOpenMenu() {
        if (!openMenuName) return;

        const button = document.querySelector(`[data-menu-button="${openMenuName}"]`);
        const menu = getMenu(openMenuName);

        if (button && menu) positionMenu(button, menu);
      }

      menuButtons.forEach((button) => {
        button.addEventListener("click", (event) => {
          event.stopPropagation();
          toggleToolbarMenu(button.dataset.menuButton);
        });
      });

      function openStatusMenu() {
        closeToolbarMenus();
        statusMenu.classList.add("is-open");
        statusMenuButton.setAttribute("aria-expanded", "true");
        positionMenu(statusMenuButton, statusMenu);
      }

      function toggleStatusMenu() {
        if (statusMenu.classList.contains("is-open")) {
          closeStatusMenu();
        } else {
          openStatusMenu();
        }
      }

      statusMenuButton.addEventListener("click", (event) => {
        event.stopPropagation();
        toggleStatusMenu();
      });

      statusMenu.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      document.addEventListener("click", (event) => {
        const inToolbarMenu = Array.from(menus).some((menu) => menu.contains(event.target));
        const inToolbarButton = Array.from(menuButtons).some((button) => button.contains(event.target));

        if (!inToolbarMenu && !inToolbarButton) closeToolbarMenus();
        if (!statusAction.contains(event.target)) closeStatusMenu();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") closeAllMenus();
      });

      window.addEventListener("resize", repositionOpenMenu);

      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", repositionOpenMenu);
        window.visualViewport.addEventListener("scroll", repositionOpenMenu);
      }

      function setPublishIcon() {
        statusMainIcon.innerHTML =
          '<path d="M22 2L11 13"></path>' +
          '<path d="M22 2L15 22L11 13L2 9L22 2Z"></path>';
      }

      function setDraftIcon() {
        statusMainIcon.innerHTML =
          '<path d="M5 4H16L19 7V20H5Z"></path>' +
          '<path d="M8 4V10H16V4"></path>' +
          '<path d="M8 20V14H16V20"></path>';
      }

      function setSelectedAction(action) {
        selectedAction = action === "draft" ? "draft" : "publish";

        const draft = selectedAction === "draft";

        statusMain.classList.toggle("status-action__main--draft", draft);
        statusMainLabel.textContent = draft ? "Save As Draft" : "Publish";
        statusMain.setAttribute("aria-label", draft ? "Save post as draft" : "Publish post");

        if (draft) {
          setDraftIcon();
        } else {
          setPublishIcon();
        }

        actionOptions.forEach((option) => {
          const active = option.dataset.actionOption === selectedAction;
          option.classList.toggle("is-active", active);
          option.setAttribute("aria-checked", String(active));
        });
      }

      function getPostContent() {
        return {
          title: titleInput.value.trim(),
          subtitle: subtitleInput.value.trim(),
          body: postBody.innerHTML.trim()
        };
      }

      function executeSelectedAction() {
        const post = getPostContent();

        if (selectedAction === "publish") {
          console.info("Publish action requested", post);
          return;
        }

        console.info("Save As Draft action requested", post);
      }

      statusMain.addEventListener("click", executeSelectedAction);

      actionOptions.forEach((option) => {
        option.addEventListener("click", () => {
          setSelectedAction(option.dataset.actionOption);
          closeStatusMenu();
        });
      });

      function setSelectedStyle(style) {
        selectedStyle = Array.from(styleOptions).some((option) => option.dataset.style === style)
          ? style
          : "normal";

        styleOptions.forEach((option) => {
          const active = option.dataset.style === selectedStyle;
          option.classList.toggle("is-active", active);
          option.setAttribute("aria-checked", String(active));
        });
      }

      styleOptions.forEach((option) => {
        option.addEventListener("click", () => {
          setSelectedStyle(option.dataset.style);
          postBody.focus();
          document.execCommand("formatBlock", false, option.dataset.style === "normal" ? "p" : option.dataset.style);
          closeToolbarMenus();
        });
      });

      function setSelectedScript(script) {
        selectedScript = ["normal", "superscript", "subscript"].includes(script) ? script : "normal";

        scriptOptions.forEach((option) => {
          const active = option.dataset.script === selectedScript;
          option.classList.toggle("is-active", active);
          option.setAttribute("aria-checked", String(active));
        });
      }

      scriptOptions.forEach((option) => {
        option.addEventListener("click", () => {
          const script = option.dataset.script;
          setSelectedScript(script);
          postBody.focus();

          if (script === "superscript") {
            document.execCommand("superscript");
          } else if (script === "subscript") {
            document.execCommand("subscript");
          } else {
            document.execCommand("removeFormat");
          }

          closeToolbarMenus();
        });
      });

      function setSelectedTextColor(color) {
        selectedTextColor = color;

        textColorOptions.forEach((option) => {
          const active = option.dataset.textColor === selectedTextColor;
          option.classList.toggle("is-active", active);
          option.setAttribute("aria-checked", String(active));
        });

        const bar = document.querySelector("[data-text-color-bar]");
        if (bar) bar.style.background = selectedTextColor;
      }

      textColorOptions.forEach((option) => {
        option.addEventListener("click", () => {
          setSelectedTextColor(option.dataset.textColor);
          postBody.focus();
          document.execCommand("foreColor", false, option.dataset.textColor);
          closeToolbarMenus();
        });
      });

      function setSelectedHighlightColor(color) {
        selectedHighlightColor = color;

        highlightOptions.forEach((option) => {
          const active = option.dataset.highlightColor === selectedHighlightColor;
          option.classList.toggle("is-active", active);
          option.setAttribute("aria-checked", String(active));
        });

        const bar = document.querySelector("[data-highlight-color-bar]");
        if (bar) bar.style.background = selectedHighlightColor;
      }

      highlightOptions.forEach((option) => {
        option.addEventListener("click", () => {
          setSelectedHighlightColor(option.dataset.highlightColor);
          postBody.focus();
          document.execCommand("hiliteColor", false, option.dataset.highlightColor);
          closeToolbarMenus();
        });
      });

      function setAlignmentIcon(alignment) {
        const allowed = ["left", "center", "right", "justify"];
        selectedAlignment = allowed.includes(alignment) ? alignment : "left";

        alignmentIcon.className.baseVal = `writing-tool__icon icon-align-${selectedAlignment}`;
        alignmentIcon.setAttribute("data-icon-name", `align-${selectedAlignment}`);
        alignmentIcon.innerHTML = `<path d="${alignmentPaths[selectedAlignment]}"></path>`;

        const label = selectedAlignment.charAt(0).toUpperCase() + selectedAlignment.slice(1);
        alignmentButton.setAttribute("aria-label", `Text alignment: ${label}`);

        alignmentOptions.forEach((option) => {
          const active = option.dataset.alignmentOption === selectedAlignment;
          option.classList.toggle("is-active", active);
          option.setAttribute("aria-checked", String(active));
        });
      }

      alignmentOptions.forEach((option) => {
        option.addEventListener("click", () => {
          setAlignmentIcon(option.dataset.alignmentOption);
          postBody.focus();

          const commands = {
            left: "justifyLeft",
            center: "justifyCenter",
            right: "justifyRight",
            justify: "justifyFull"
          };

          document.execCommand(commands[selectedAlignment]);
          closeToolbarMenus();
        });
      });

      document.querySelectorAll("[data-tool-action]").forEach((button) => {
        button.addEventListener("click", () => {
          const action = button.dataset.toolAction;
          postBody.focus();

          if (action === "undo") document.execCommand("undo");
          if (action === "redo") document.execCommand("redo");
          if (action === "bold") document.execCommand("bold");
          if (action === "italic") document.execCommand("italic");

          if (action === "quote") {
            document.execCommand("formatBlock", false, "blockquote");
          }

          if (action === "bullet-list") {
            document.execCommand("insertUnorderedList");
          }

          if (action === "number-list") {
            document.execCommand("insertOrderedList");
          }

          if (action === "link") {
            const url = window.prompt("Enter URL");
            if (url) document.execCommand("createLink", false, url);
          }
        });
      });

      mediaOptions.forEach((option) => {
        option.addEventListener("click", () => {
          console.info(`${option.dataset.mediaOption} insert requested`);
          closeToolbarMenus();
        });
      });

      postBody.addEventListener("input", () => {
        if (postBody.innerHTML === "<br>") postBody.innerHTML = "";
      });

      setSelectedAction("publish");
      setSelectedStyle("normal");
      setSelectedScript("normal");
      setSelectedTextColor("#171717");
      setSelectedHighlightColor("#d9ff4f");
      setAlignmentIcon("left");
    });
  </script>
</body>
</html>
