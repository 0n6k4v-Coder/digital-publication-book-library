[package]
name = "digital-publication-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"

[dependencies]
addr-spec = "0.10.4"
argon2 = "0.6.0"
axum = "0.8.9"
dotenvy = "0.15.7"
idna = "1.1.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "time", "migrate", "macros"] }
thiserror = "2.0"
time = { version = "0.3.55", features = ["serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
unicode-casefold = "0.2.0"
unicode-normalization = "0.1.25"
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }