name: digital-publication-book-library-backend-test

services:
  postgres:
    image: postgres:18.6-bookworm

    environment:
      POSTGRES_DB: digital_publication_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

    volumes:
      - postgres-test-data:/var/lib/postgresql

  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.test

    working_dir: /workspace

    init: true

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/digital_publication_test
      TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/digital_publication_test
      RUST_BACKTRACE: "1"
      CARGO_TERM_COLOR: always

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - type: bind
        source: ..
        target: /workspace
      - cargo-target:/workspace/target
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git

    command:
      [
        "cargo",
        "test",
        "--tests",
        "--no-fail-fast",
        "--",
        "--include-ignored"
      ]

volumes:
  postgres-test-data:

  cargo-target:
    name: digital-publication-cargo-target
    external: true

  cargo-registry:
    name: digital-publication-cargo-registry
    external: true

  cargo-git:
    name: digital-publication-cargo-git
    external: true